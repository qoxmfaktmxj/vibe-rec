spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5435/vibe_rec_test}
    username: ${DB_USERNAME:vibe_rec}
    password: ${DB_PASSWORD:vibe_rec}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth-rate-limit:
    signup:
      max-requests: 1000
  notification:
    dispatch-initial-delay-ms: 3600000
  candidate:
    mail:
      dispatch-initial-delay-ms: 3600000
  admin:
    dev-account:
      enabled: true
